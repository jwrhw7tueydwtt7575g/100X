upstream wariverse_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # The voice endpoint accepts a 10 MB recording. nginx defaults to 1 MB and
    # would reject it with its own 413 before the app ever sees the upload.
    client_max_body_size 12m;

    # Long enough for an LLM turn or a TTS synthesis; short enough that a hung
    # upstream does not pin a worker forever.
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Health checks should not fill the access log.
    location = /health {
        access_log off;
        proxy_pass http://wariverse_api;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location / {
        proxy_pass http://wariverse_api;
        include /etc/nginx/conf.d/proxy_headers.inc;

        # Audio is streamed from /api/voice/speak; buffering it here would
        # defeat the point of streaming.
        proxy_buffering off;
        proxy_http_version 1.1;
    }
}

